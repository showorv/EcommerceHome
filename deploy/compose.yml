# Production stack for one server (Phase 3.6): Caddy (HTTPS) → web (Next.js) + worker, MongoDB
# (single-node replica set, for transactions) and Redis. Only Caddy is reachable from the internet;
# MongoDB and Redis listen on the Docker network and on the server's own 127.0.0.1 (for the build).
#
#   cd deploy && docker compose up -d --build        # first start and every update
#
# Settings live in deploy/.env.production (copy env.production.example).

name: shop

x-app: &app
  image: shop-app:latest
  env_file: .env.production
  environment:
    INTERNAL_APP_URL: http://web:3000
    CLIENT_IP_HEADER: x-real-ip # set by Caddy, which knows the visitor's real address
  restart: unless-stopped
  depends_on:
    mongo: { condition: service_healthy }
    redis: { condition: service_healthy }
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  web:
    <<: *app
    build:
      context: ..
      dockerfile: Dockerfile
      network: host # the build prerenders pages from MongoDB on 127.0.0.1:27017
      secrets: [env]
    command: ["node_modules/.bin/next", "start"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    <<: *app
    command: ["node_modules/.bin/tsx", "worker/index.ts"]
    depends_on:
      web: { condition: service_healthy }

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443", "${HTTPS_PORT:-443}:443/udp"]
    env_file: .env.production
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: { condition: service_healthy }
    logging: *logging

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    env_file: .env.production
    # The key file lets the replica set's member trust itself; it must be private to the mongodb user.
    entrypoint:
      - bash
      - -c
      - |
        install -m 400 -o mongodb -g mongodb /run/secrets/mongo_keyfile /tmp/mongo-keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/mongo-keyfile
    secrets: [mongo_keyfile]
    ports: ["127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"]
    volumes:
      - mongo-data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Starts the replica set on first boot (transactions need one), then just reports its state.
      test:
        - CMD-SHELL
        - >
          mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin
          --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    env_file: .env.production
    command:
      ["sh", "-c", 'exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"']
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

secrets:
  env:
    file: .env.production
  mongo_keyfile:
    file: ./secrets/mongo-keyfile

volumes:
  mongo-data:
  redis-data:
  caddy-data:
  caddy-config:
