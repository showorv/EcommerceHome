# Local development services. Start with: pnpm services:up
services:
  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports: ["27018:27017"] # 27018 on the host so it never clashes with a locally installed MongoDB
    volumes: [mongo-data:/data/db]
    healthcheck:
      # Initialise the single-node replica set on first boot (transactions need a replica set).
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]

  mailpit:
    # Fake inbox for emails sent in development: http://localhost:8025
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

volumes:
  mongo-data:
  redis-data:
